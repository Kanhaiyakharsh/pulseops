# Local infrastructure for PulseOps. Run from the repo root:
#   npm run infra:up      (docker compose --env-file .env -f infrastructure/docker-compose.yml up -d --wait)
name: pulseops

services:
  mongodb:
    image: mongo:7.0
    container_name: pulseops-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-pulseops}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-pulseops_dev_password}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-pulseops}
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --norc
          -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    container_name: pulseops-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-pulseops_dev_password}
      - --appendonly
      - 'yes'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pulseops_dev_password}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo-data:
  redis-data:
